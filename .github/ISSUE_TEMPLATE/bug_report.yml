name: Bug report
description: Report incorrect behavior that is not a rule false positive.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make agent-shellcheck more reliable.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "agent-shellcheck 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Remove secrets and personal paths before pasting.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
