name: False positive
description: Report a diagnostic that fires on valid, intentional instructions.
title: "false positive: "
labels: [false-positive, rules]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: ASC003
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - auto
        - portable
        - bash-linux
        - bash-wsl
        - powershell-windows
        - cmd-windows
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal instruction snippet
      description: Keep only the lines needed to reproduce the diagnostic.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this should not trigger
      description: Include relevant shell and platform behavior.
    validations:
      required: true
