name: Rule request
description: Propose a high-signal portability diagnostic.
title: "rule: "
labels: [enhancement, rules]
body:
  - type: textarea
    id: problem
    attributes:
      label: Portability problem
      description: What breaks, on which target, and why is the failure actionable?
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Minimal triggering example
      render: markdown
    validations:
      required: true
  - type: textarea
    id: safe
    attributes:
      label: Nearby non-triggering example
      description: Show how the rule avoids a likely false positive.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Platform references
      description: Link to primary shell or platform documentation when possible.
    validations:
      required: true
